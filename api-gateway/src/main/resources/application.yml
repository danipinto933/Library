server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  config:
    # Carga configuración del Config Server (rutas, CORS, JWT secret)
    # "optional:" evita fallo si el Config Server no está disponible al arrancar
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always

