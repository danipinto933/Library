services:
  db:
    image: postgres:15-alpine
    container_name: library-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  config-server:
    build:
      context: ./config-server
    container_name: library-config-server
    ports:
      - "8888:8888"
    restart: always
    volumes:
      - ./config-repo:/config-repo

  discovery-server:
    build:
      context: ./discovery-server
    container_name: library-discovery-server
    ports:
      - "8761:8761"
    restart: always
    depends_on:
      - config-server


  api-gateway:
    build:
      context: ./api-gateway
    container_name: library-api-gateway
    ports:
      - "8085:8080"
    restart: always
    depends_on:
      - discovery-server
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}

  auth-service:
    build:
      context: ./auth-service
    container_name: library-auth-service
    ports:
      - "8084:8084"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      user-service:
        condition: service_started
      discovery-server:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/library_users
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}

  user-service:
    build:
      context: ./user-service
    container_name: library-user-service
    ports:
      - "8081:8081"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/library_users
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update


  book-service:
    build:
      context: ./book-service
    container_name: library-book-service
    ports:
      - "8082:8082"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/library_books
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

    volumes:
      - ./book-service/uploads:/app/uploads

  reserve-service:
    build:
      context: ./reserve-service
    container_name: library-reserve-service
    ports:
      - "8083:8083"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/library_reserves
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: library-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8085/api/v1
      - VITE_COVERS_URL=http://localhost:8085/uploads/covers
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: always
    depends_on:
      - api-gateway

  kafka:
    image: apache/kafka:3.7.0
    container_name: library-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    restart: always

volumes:
  postgres_data: