server:
  port: ${PORT:8084}


spring:
  application:
    name: auth-service
  datasource:
    # Auth-Service comparte la base de datos de usuarios (solo necesita leer
    # userName, password y role para autenticar). Evita duplicar datos de usuario.
    url: ${DB_USERS_URL:jdbc:postgresql://localhost:5432/library_users}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Validate: no modifica el esquema, solo verifica que las entidades coincidan
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt-secret: ${JWT_SECRET}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
