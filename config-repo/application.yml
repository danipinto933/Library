# Configuración COMPARTIDA por todos los microservicios
# Cada servicio la hereda automáticamente del Config Server

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: ReservationEvent:com.library.reserveservice.event.ReservationEvent,ReservationEvent:com.library.bookservice.event.ReservationEvent
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: ReservationEvent:com.library.reserveservice.event.ReservationEvent,ReservationEvent:com.library.bookservice.event.ReservationEvent
