spring.application.name=fullstackbackend-test

# Import environment variables from the .env file in the workspace parent directories
# The [.properties] suffix tells Spring Boot to parse the file format as standard properties
spring.config.import=optional:file:../../.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]

# Use in-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Application-specific variables read dynamically from imported .env, with defaults for testing
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt-secret=${JWT_SECRET:defaultSecretKeyForTestingOnly1234567890}
